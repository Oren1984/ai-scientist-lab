[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientist-lab"
version = "1.0.0"
description = "AI Scientist Lab V1.0 — bounded research agent over a synthetic queue sandbox (by Oren Salami)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "altair>=5", "pandas>=2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
